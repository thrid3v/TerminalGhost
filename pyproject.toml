[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminalghost"
dynamic = ["version"]
description = "Local-first terminal-resident AI assistant that watches your shell and answers ?? queries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thridev", email = "offlthridev@gmail.com" }]
keywords = ["terminal", "cli", "ai", "assistant", "llm", "ollama", "shell", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Software Development",
]
dependencies = [
    # Async HTTP client — used by the Ollama backend (default)
    "httpx>=0.27",
    # Process utilities — daemon PID management (start/stop/status)
    "psutil>=6.0",
    # Terminal UI — banner, themed output, live-markdown streaming answers
    "rich>=13.7",
    # Full-screen dashboard (terminalghost dashboard)
    "textual>=0.60",
]

[project.optional-dependencies]
# Cloud backends — only needed when llm.backend = "claude".
cloud = ["anthropic>=0.30"]
# Only needed for the (not yet implemented) Unix-only PTY deep-capture path.
pty = ["ptyprocess>=0.7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/thrid3v/TerminalGhost"
Repository = "https://github.com/thrid3v/TerminalGhost"
Issues = "https://github.com/thrid3v/TerminalGhost/issues"

[project.scripts]
# Primary entrypoint — run as: terminalghost start | stop | status | init | doctor | ...
terminalghost = "terminalghost.daemon.process:main"

[tool.hatch.version]
path = "src/terminalghost/__init__.py"

[tool.hatch.build.targets.wheel]
# Non-Python files under the package (terminalghost/_assets/*) are included
# automatically by hatchling.
packages = ["src/terminalghost"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py311"
