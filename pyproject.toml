[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminalghost"
version = "0.1.0"
description = "Local-first terminal-resident AI assistant that watches your shell and answers ?? queries"
requires-python = ">=3.11"
dependencies = [
    # Async HTTP client — used by the Ollama backend
    "httpx>=0.27",
    # Anthropic Python SDK — used by the Claude cloud backend (imported lazily)
    "anthropic>=0.30",
    # Process utilities — daemon PID management (start/stop/status)
    "psutil>=6.0",
]

[project.optional-dependencies]
# Only needed for the (not yet implemented) Unix-only PTY deep-capture path.
pty = ["ptyprocess>=0.7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
# Primary daemon entrypoint — run as: terminalghost start | stop | status
terminalghost = "terminalghost.daemon.process:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terminalghost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py311"
