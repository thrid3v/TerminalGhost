[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminalghost"
version = "0.1.0"
description = "Local-first terminal-resident AI assistant that watches your shell and answers ?? queries"
requires-python = ">=3.11"
dependencies = [
    # Async HTTP client — used by the Ollama backend and cloud backends
    "httpx>=0.27",
    # Anthropic Python SDK — used by the Claude cloud backend stub
    "anthropic>=0.30",
    # TOML writer (tomllib in stdlib is read-only)
    "tomli-w>=1.0",
    # Rich terminal output — streaming LLM responses, formatted suggestions
    "rich>=13.0",
    # Process & system utilities — daemon PID management, process tree inspection
    "psutil>=6.0",
    # ptyprocess — cross-platform PTY spawning helper (Unix only at runtime)
    "ptyprocess>=0.7",
    # watchdog — optional config hot-reload; file-system event monitoring
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
# Primary daemon entrypoint — run as: terminalghost start | stop | status
terminalghost = "terminalghost.daemon.process:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terminalghost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py311"
