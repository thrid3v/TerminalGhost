name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev + cloud extras)
        run: python -m pip install -e ".[dev,cloud]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q

  package:
    name: build + install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
      - name: Smoke test the console script (proves bundled assets ship)
        run: |
          /tmp/smoke/bin/terminalghost --version
          test -f "$(/tmp/smoke/bin/terminalghost hook-path bash)"
          /tmp/smoke/bin/terminalghost hook-path zsh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
