name: release

# Publishes to PyPI on a version tag (e.g. v0.2.0) using Trusted Publishing
# (OIDC) — no API token stored in the repo. Configure the publisher once at
# https://pypi.org/manage/project/terminalghost/settings/publishing/ with:
#   owner=thrid3v  repo=TerminalGhost  workflow=release.yml  environment=pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify version tag matches package version
        run: |
          python - <<'PY'
          import os, re, pathlib
          init = pathlib.Path("src/terminalghost/__init__.py").read_text()
          ver = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          tag = os.environ.get("GITHUB_REF_NAME", "")
          assert tag in ("", f"v{ver}"), f"tag {tag!r} != v{ver!r}"
          print("version ok:", ver)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
